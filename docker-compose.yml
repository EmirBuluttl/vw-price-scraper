version: '3.8'

services:
  price-scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: price-scraper-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_SECRET_KEY=price_scraper_enterprise_secret_2026
      - PORT=5000
    volumes:
      - ./car_prices.db:/app/car_prices.db
      - ./static/logos:/app/static/logos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
