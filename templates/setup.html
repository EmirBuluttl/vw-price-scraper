{% extends "base.html" %}

{% block title %}Admin Şifresi Oluştur — Araç Fiyat Takip{% endblock %}

{% block content %}
<div class="auth-card-container">
    <div class="auth-card glass-panel">
        <div class="auth-header">
            <div class="brand-logo">
                <i class="fa-solid fa-car-side"></i>
            </div>
            <h2>Sistem Kurulumu</h2>
            <p>Devam etmek için lütfen Admin şifrenizi belirleyin.</p>
        </div>

        <form method="POST" action="{{ url_for('setup_admin') }}" class="auth-form">
            <div class="form-group">
                <label for="password"><i class="fa-solid fa-lock"></i> Yeni Admin Şifresi</label>
                <input type="password" id="password" name="password" required placeholder="En az 4 karakter giriniz" autofocus>
            </div>

            <div class="form-group">
                <label for="confirm_password"><i class="fa-solid fa-shield-halved"></i> Şifre Tekrarı</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="Şifrenizi tekrar giriniz">
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fa-solid fa-check-double"></i> Admin Şifresini Kaydet ve Giriş Yap
            </button>
        </form>
    </div>
</div>
{% endblock %}
